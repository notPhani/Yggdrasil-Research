# Yggdrasil default configuration. Its sha256 (paths excluded) is the cfg_hash stamped on every artifact (D6).

[paths]
data_dir = "data"                    # gitignored; raw blobs, Parquet tables, snapshots

[replay]
start = "2024-12-16"                 # blind cold start begins (3.7)
warmup_end = "2025-01-06"            # end of the 3-week cold start; replay proper from here
end_exclusive = "2025-02-01"         # replay runs through 2025-01-31
window_seconds = 900                 # Delta = 15 min, fixed by GDELT
ingest_lag_seconds = 900             # D1: ingested_time = observed_time + 15 min in replay

[fetch]
workers = 8                          # measured 12.7 MB/s on 8 streams (2026-10-06)

[determinism]
tie_key = ["observed_time", "source_rank", "url_key", "record_id"]   # D4

[dedup]                              # L2 semantic dedup (Session 1, frozen four-step B; cut: step 1 + fallback A)
horizon_h = 72.0
j0 = 0.5                             # names Jaccard for step 1 / A; tuned later against the SerpApi filter=0 referee (A9)
theta_a = 0.9                        # title-embedding cosine for fallback A (requires matching entities or an amount too)
logo_titles = 5                      # an image under >= 5 distinct titles from one source is a site logo (guard)
embed_model = "minishlab/potion-base-8M"   # near-duplicate step only; theta_a is calibrated on it; ~11k titles/s

[narratives]
embed_model = "sentence-transformers/all-MiniLM-L6-v2"   # Engine 2a; same-event AUC 0.854 (potion 0.832); fp32 ONNX
# 2a-L parameters (2026-10-10). kappa_s: the prequential score on Dec 16-17 rises monotonically over {60, 100, 150, 250}
# (610 -> 636 nats/event) and the data-implied kappa is 280-310, so 250 stays. log_alpha and temp: defaults, not fitted.
kappa_s = 250.0
log_alpha = -15.0
temp = 2.0
checks_needed = 3                    # locked 3.5: splits and merges must win at 3 consecutive 6-hour checks
# Adaptive emergence, in birth-rate units: each term is a log factor on the birth rate, times beta_tail nats.
adaptive = true                      # false restores 2a-L exactly as locked 2026-10-07 (with hysteresis)
beta_tail = 31.0                     # e-fold scale of the birth-evidence upper tail: mean exceedance over the 90th
                                     # percentile, Dec 16-17 at kappa_s 250 (31.1 nats; 37.6 over the 95th)
rho_vol = 1.0                        # births x (V_7d / V_6h): spurious births per window held constant
gamma_burst = 1.0                    # births x (events per hour)^1 for a fast group, at most x20; hand-set, disclosed
k_soft = 200                         # alive narratives where births start to be suppressed ...
k_max = 300                          # ... by e^-3 (x0.05) at k_max (locked target 100-300 alive)
cap_rate = 3.0
