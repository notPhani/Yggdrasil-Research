  const X = o.log ? lg(o.domain[0], o.domain[1], m.l, W - m.r) : lin(0, o.domain[1], m.l, W - m.r);
  const muted = css("--muted"), ink = css("--ink"), ink2 = css("--ink-2"), grid = css("--rule"), mono = css("--f-mono"), surf = css("--surface");

  const x0 = o.log ? X(o.domain[0]) : X(0);
  o.rows.forEach((r, i) => {
    const y = m.t + i * rowH;
    const lab = el("text", { x: m.l - 8, y: y + rowH / 2 + 4, "text-anchor": "end", fill: ink2, "font-size": 11.5 }, svg);
    lab.textContent = narrow && r.short ? r.short : r.label;

    lineChart(g("ch-trace"), { aria: "Share of a pulse's influence delivered within L hours for four timescales", height: 220, xLog: true,
      xDomain: [0.25, 336], yDomain: [0, 1], xTicks: [0.25, 1, 6, 24, 168], yTicks: [0, 0.5, 1], xFmt: v => ({ 0.25: "15m", 1: "1h", 6: "6h", 24: "1d", 168: "1w" })[v], yFmt: v => Math.round(v * 100) + "%",
      xLabel: "lag L (log scale)", tipHead: v => "L = " + hrs(v), tipFmt: v => (v * 100).toFixed(1) + "%",
      series: TAUS.map((t, i) => ({ name: "τ = " + t[1], color: ["--s1", "--s2", "--s3", "--s4"][i], xs: L, ys: L.map(l => 1 - Math.exp(-l / t[0])) })) }); }
  if (g("ch-softplus")) { const xs = range(-4, 4, 81);
    lineChart(g("ch-softplus"), { aria: "Scaled softplus for two scales against the ReLU", height: 220,
      xDomain: [-4, 4], yDomain: [0, 4.5], xTicks: [-4, -2, 0, 2, 4], yTicks: [0, 1, 2, 3, 4], xFmt: v => v, yFmt: v => v, xLabel: "drive η",
      tipHead: v => "η = " + v.toFixed(1), tipFmt: v => v.toFixed(3),
      series: [{ name: "max(η, 0)", color: "--neutral", xs, ys: xs.map(x => Math.max(0, x)) }, { name: "s = 1", color: "--s1", xs, ys: xs.map(x => sp(x, 1)) }, { name: "s = 0.25", color: "--s2", xs, ys: xs.map(x => sp(x, 0.25)) }] }); }
  if (g("ch-comp")) { const xs = range(0, 10, 101);
    lineChart(g("ch-comp"), { aria: "Total attention versus total drive for five values of omega", height: 220,
      xDomain: [0, 10], yDomain: [0, 10], xTicks: [0, 2, 4, 6, 8, 10], yTicks: [0, 2, 4, 6, 8, 10], xFmt: v => v + "B", yFmt: v => v + "B", xLabel: "total drive S_raw",
      tipHead: v => "S_raw = " + v.toFixed(1) + " B", tipFmt: v => v.toFixed(2) + " B",
      series: [[0, "--neutral"], [0.25, "--s1"], [0.5, "--s3"], [0.75, "--s4"], [1, "--s2"]].map(([w, c]) => ({ name: "ω = " + w, color: c, xs, ys: xs.map(x => x * Math.pow(1 / (1 + x), w)) })),
      annotate: (svg, X, Y, m, W, H) => { el("line", { x1: m.l, x2: W - m.r, y1: Y(1), y2: Y(1), stroke: css("--bad"), "stroke-dasharray": "4 3" }, svg); } }); }
  if (g("ch-bin")) { const T = logRange(0.25, 168, 100);
    lineChart(g("ch-bin"), { aria: "Same-bin offspring share and coefficient bias factor versus kernel timescale", height: 220, xLog: true,
      xDomain: [0.25, 168], yDomain: [0, 1], xTicks: [0.25, 1, 6, 24, 168], yTicks: [0, 0.25, 0.5, 0.75, 1], xFmt: v => ({ 0.25: "15m", 1: "1h", 6: "6h", 24: "1d", 168: "1w" })[v], yFmt: v => v.toFixed(2),
      xLabel: "kernel timescale τ (log scale), bin Δ = 15 min", tipHead: v => "τ = " + hrs(v), tipFmt: v => v.toFixed(3),
      series: [{ name: "same-bin share", color: "--s2", xs: T, ys: T.map(t => { const x = 0.25 / t; return 1 - (1 - Math.exp(-x)) / x; }) },
               { name: "bias factor", color: "--s1", xs: T, ys: T.map(t => { const x = 0.25 / t; return (1 - Math.exp(-x)) / x; }) }],
      after: (svg, X, Y) => { for (const [t] of TAUS) { const x = 0.25 / t, f = (1 - Math.exp(-x)) / x; el("circle", { cx: X(t), cy: Y(f), r: 4, fill: css("--s1"), stroke: css("--surface"), "stroke-width": 2 }, svg); el("circle", { cx: X(t), cy: Y(1 - f), r: 4, fill: css("--s2"), stroke: css("--surface"), "stroke-width": 2 }, svg); } } }); }
  trigRows();
}

function tables() {
  table("tv-cols", ["Column", "Bytes/doc", "Kept", "Note"], COLS.map(r => [r[0], fmtN(r[1]), r[2] ? "yes" : "no", r[4]]), [1]);
  table("tv-gkgz", ["Encoding", "Bytes/doc"], GKGZ.map(r => [r[0], fmtN(r[1])]), [1]);
  table("tv-pricez", ["Encoding", "Bytes/bar"], PRICEZ.map(r => [r[0], r[1].toFixed(1)]), [1]);
  table("tv-sar", ["Symbol", "SAR market-only", "SAR market + sector"], SAR2.map(r => [r[0], r[1].toFixed(1), r[2].toFixed(1)]), [1, 2]);
  table("tv-lsh", ["J", "LSH candidate", "P(Ĵ ≥ 0.8)"], [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95].map(j => { const i = Math.round(j * 100); return [j.toFixed(2), LSH.lsh[i].toFixed(3), LSH.acc[i] < 0.001 ? LSH.acc[i].toExponential(1) : LSH.acc[i].toFixed(3)]; }), [1, 2]);
  table("tv-dl", ["Step", "Cumulative GB", "Hours at 10 MB/s", "Hours at 2.2 MB/s"], STEPS.map(([gb, l]) => [l, gb.toFixed(1), (gb / 36).toFixed(2), (gb / 7.92).toFixed(1)]), [1, 2, 3]);
  table("tv-trace", ["Lag", "τ = 1 h", "6 h", "1 d", "1 w"], [0.25, 1, 6, 24, 168, 336].map(l => [hrs(l), ...TAUS.map(t => (100 * (1 - Math.exp(-l / t[0]))).toFixed(1) + "%")]), [1, 2, 3, 4]);
  table("tv-softplus", ["η", "max(η,0)", "s = 1", "s = 0.25"], [-4, -2, -1, 0, 1, 2, 4].map(x => [x, Math.max(0, x).toFixed(3), sp(x, 1).toFixed(3), sp(x, 0.25).toFixed(3)]), [0, 1, 2, 3]);
  table("tv-comp", ["S_raw / B", "ω = 0", "0.25", "0.5", "0.75", "1"], [0.5, 1, 2, 5, 10].map(x => [x, ...[0, 0.25, 0.5, 0.75, 1].map(w => (x * Math.pow(1 / (1 + x), w)).toFixed(2))]), [0, 1, 2, 3, 4, 5]);
  table("tv-bin", ["τ", "a", "same-bin share", "bias factor (1 − a)/x", "worst case 1 − a"], TAUS.map(([t, l]) => { const x = 0.25 / t, a = Math.exp(-x); return [l, a.toFixed(5), (1 - (1 - a) / x).toFixed(4), ((1 - a) / x).toFixed(4), (1 - a).toFixed(4)]; }), [1, 2, 3, 4]);
}

function boot() { tables(); drawAll(); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawAll, 150); });
const mq = window.matchMedia("(prefers-color-scheme: light)");
if (mq.addEventListener) mq.addEventListener("change", drawAll);
new MutationObserver(drawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
